---
- name: Edit SYN protections and profiles
  hosts: cc
  gather_facts: false
  vars_files:
    - ../vars/cc.yml
    - ../vars/edit_vars.yml

  tasks:

    - name: Lock device(s)
      dp_lock:
        provider: "{{ cc }}"
        dp_ip: "{{ item }}"
      loop: "{{ dp_ip | default([]) }}"
      loop_control:
        label: "Locking device: {{ item }}"
      when: not (skip_device_lock | default(false))

    - name: Edit SYN protections and profiles
      edit_syn_configuration:
        provider: "{{ cc }}"
        dp_ip: "{{ item }}"
        syn_protections: "{{ edit_syn_protections | default([]) }}"
        syn_profiles: "{{ edit_syn_profiles | default([]) }}"
      loop: "{{ dp_ip | default([]) }}"
      loop_control:
        label: "Device: {{ item }}"
      register: syn_edit_results
      ignore_errors: true
      when: (edit_syn_profiles is defined and edit_syn_profiles | length > 0) or
            (edit_syn_protections is defined and edit_syn_protections | length > 0)

    - name: Display SYN edit results
      vars:
        response: "{{ item.response | default({}) }}"
        profiles: "{{ response.edited_profiles | default([]) }}"
        protections: "{{ response.edited_protections | default([]) }}"
        errors: "{{ response.errors | default([]) }}"
        formatted_output: |
          **Device: {{ item.item }}**

          EXECUTION RESULTS:

          {% if profiles %}
          **SYN Profiles Edited ({{ profiles | length }}):**
          {% for prof in profiles %}
            - **Profile Name:** {{ prof.name }}
              {% if prof.user_friendly is defined %}
              Parameters:
              {% for k, v in prof.user_friendly.items() %}
                - {{ k | replace('_',' ') | capitalize }}: {{ v }}
              {% endfor %}
              {% endif %}
              {% if prof.error is defined %}
              - Error: {{ prof.error }}
              {% endif %}
          {% endfor %}
          {% else %}
          No profiles were edited.
          {% endif %}

          {% if protections %}
          **SYN Protections Edited ({{ protections | length }}):**
          {% for prot in protections %}
            - **Protection Name:** {{ prot.name }}
              {% if prot.user_friendly is defined %}
              Parameters:
              {% for k, v in prot.user_friendly.items() %}
                - {{ k | replace('_',' ') | capitalize }}: {{ v }}
              {% endfor %}
              {% endif %}
              {% if prot.error is defined %}
              - Error: {{ prot.error }}
              {% endif %}
          {% endfor %}
          {% else %}
          No protections were edited.
          {% endif %}

          {% if errors %}
          **Errors Detected ({{ errors | length }}):**
          {% for err in errors %}
            - {{ err }}
          {% endfor %}
          {% else %}
          No device-level errors detected.
          {% endif %}
      ansible.builtin.debug:
        msg: "{{ formatted_output.split('\n') }}"
      loop: "{{ syn_edit_results.results | default([]) }}"
      loop_control:
        label: "Device: {{ item.item }}"

    - name: Unlock device(s)
      dp_unlock:
        provider: "{{ cc }}"
        dp_ip: "{{ item }}"
      loop: "{{ dp_ip | default([]) }}"
      loop_control:
        label: "Unlocking device: {{ item }}"
      failed_when: false
      when: not (skip_device_lock | default(false))
